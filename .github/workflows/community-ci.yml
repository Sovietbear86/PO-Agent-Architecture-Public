name: Community CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/gigacode-public-deploy-health-skills]

permissions:
  contents: read

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pre-publish scan
        run: python3 scripts/prepublish_scan.py

  health-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline health-check contract
        run: |
          python -m compileall -q scripts/public_health_check.py
          python -m unittest discover -s scripts/tests -p 'test_public_health_check.py' -v
          python scripts/public_health_check.py --help

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Agent
        run: |
          python -m pip install --upgrade pip
          pip install -e './po-agent-platform-v2[dev]'
      - name: Compile Agent
        run: python -m compileall -q po-agent-platform-v2/src/po_agent
      - name: Import Agent app
        env:
          AS21_MODE: fake
          AGENT_CORE_V4_ENABLED: "true"
          LLM_API_KEY: ""
        run: |
          python - <<'PY'
          from po_agent.main import app
          print(app.title)
          PY
      - name: Install Task API
        run: pip install -r task-api/requirements.txt
      - name: Import read-only Task API
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "task-api")
          import main
          paths = {getattr(route, "path", None) for route in main.app.routes}
          forbidden = {"/api/v1/tasks", "/api/v1/swtr-sync"}
          assert not (paths & forbidden), paths & forbidden
          print(main.app.title)
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: po-agent-platform-v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: po-agent-platform-v2/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  offline-agent-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared Agent test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e './po-agent-platform-v2[dev]'
      - name: Focused synthetic V4 regressions (no REAL AS21 required)
        env:
          AS21_MODE: fake
          AGENT_CORE_V4_ENABLED: "true"
          LLM_API_KEY: ""
        run: |
          python -m pytest -q \
            po-agent-platform-v2/tests/test_member_worklogs_period.py \
            po-agent-platform-v2/tests/test_api_free_text_clarification.py \
            po-agent-platform-v2/tests/test_api_sprint_lifetime_guard.py \
            po-agent-platform-v2/tests/test_member_sprint_scope_explanation.py \
            po-agent-platform-v2/tests/test_sprint_aggregate_scope_guard.py \
            po-agent-platform-v2/tests/test_public_task_catalog_migration.py \
            po-agent-platform-v2/tests/test_a230r2_week_periods.py

  offline-task-api-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install strictly declared Task API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r task-api/requirements.txt
      - name: Test synthetic read-only SWTR facades
        env:
          PYTHONPATH: task-api
        run: |
          python -m pytest -q \
            task-api/tests/test_swtr_person_worklogs_report.py \
            task-api/tests/test_public_assignee_suit.py

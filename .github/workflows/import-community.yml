name: One-time community import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-community.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout sanitized source snapshot
        uses: actions/checkout@v4
        with:
          repository: Sovietbear86/PO-Agent-Architecture-Review
          ref: community/export-v1-prep
          path: _source
          fetch-depth: 1

      - name: Replace destination tree without source Git history
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="${RUNNER_TEMP}/po-agent-community-snapshot"
          rm -rf "${SNAPSHOT}"
          mkdir -p "${SNAPSHOT}"
          rsync -a --exclude='.git' _source/ "${SNAPSHOT}/"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a "${SNAPSHOT}/" ./
          rm -rf .github/workflows/import-community.yml || true

      - name: Pre-publish sanitization scan
        run: python3 scripts/prepublish_scan.py

      - name: Commit clean community snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PO Agent Community Import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import clean PO Agent Harness community snapshot"
          git push origin main
